<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مدرسة بلماحي للدعم - Belmahi's School</title>
    <!-- خط تجوال العصري من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --border-color: #334155;
            --glass-bg: rgba(30, 41, 59, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.25s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
        }

        /* Top Header Navigation */
        header {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-circle {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #0284c7, #0d9488);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
        }

        .brand-titles h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .brand-titles p {
            font-size: 0.75rem;
            color: var(--accent-blue);
            letter-spacing: 0.5px;
        }

        .nav-switch {
            background: #020617;
            padding: 4px;
            border-radius: 10px;
            display: flex;
            border: 1px solid var(--border-color);
        }

        .nav-link {
            padding: 8px 18px;
            border-radius: 8px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .nav-link.active {
            background: var(--accent-blue);
            color: #020617;
            font-weight: 700;
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }

        /* Container & Layout */
        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .page-section {
            display: none;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .page-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Section Headings */
        .section-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h2 {
            font-size: 1.5rem;
            color: var(--text-light);
            position: relative;
            padding-right: 12px;
        }

        .section-header h2::before {
            content: '';
            position: absolute;
            right: 0;
            top: 20%;
            height: 60%;
            width: 4px;
            background: var(--accent-blue);
            border-radius: 2px;
        }

        /* Grid Cards Layout */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .pdf-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            width: fit-content;
        }

        .pdf-btn:hover {
            background: #ef4444;
            color: #fff;
        }

        /* Forms Styling */
        .form-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 1rem;
        }

        .form-control label {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        .form-control input, .form-control textarea {
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-light);
            font-size: 0.95rem;
            outline: none;
        }

        .form-control input:focus, .form-control textarea:focus {
            border-color: var(--accent-blue);
        }

        .action-btn {
            background: var(--accent-blue);
            color: #020617;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        /* Password Auth Section */
        .auth-box {
            max-width: 400px;
            margin: 3rem auto;
            text-align: center;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-box">
            <div class="logo-circle">BS</div>
            <div class="brand-titles">
                <h1>مدرسة بلماحي للدعم</h1>
                <p>BELMAHI'S ACADEMY</p>
            </div>
        </div>

        <nav class="nav-switch">
            <div id="navStudent" class="nav-link active" onclick="showSection('student')">
                🎓 فضاء التلميذ
            </div>
            <div id="navTeacher" class="nav-link" onclick="showSection('teacher')">
                👨‍🏫 فضاء الأستاذ
            </div>
        </nav>
    </header>

    <main>

        <!-- 1. فضاء التلميذ -->
        <section id="student" class="page-section active">
            <div class="section-header">
                <h2>الواجبات والتمارين المتاحة</h2>
            </div>

            <div class="grid-cards">
                <!-- واجب محاكى -->
                <div class="card">
                    <div class="card-header">

                        <span class="card-tag">علوم تجريبية - بكالوريا</span>
