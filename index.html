<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مدرسة بلماحي للدعم - Belmahi's School</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- مكتبة Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1e293b;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-circle {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #0284c7, #0d9488);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
        }

        .brand-titles h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .brand-titles p {
            font-size: 0.75rem;
            color: var(--accent-blue);
        }

        .nav-switch {
            background: #020617;
            padding: 4px;
            border-radius: 10px;
            display: flex;
            border: 1px solid var(--border-color);
            gap: 5px;
        }

        .nav-btn {
            padding: 10px 20px;
            border-radius: 8px;
            color: var(--text-dim);
            background: transparent;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .nav-btn.active {
            background: var(--accent-blue);
            color: #020617;
            font-weight: 700;
        }

        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        .section-header {
            margin-bottom: 2rem;
        }

        .section-header h2 {
            font-size: 1.5rem;
            border-right: 4px solid var(--accent-blue);
            padding-right: 12px;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-control input, .form-control textarea {
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: white;
        }

        .action-btn {
            background: var(--accent-blue);
            color: #020617;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-box {
            max-width: 400px;
            margin: 3rem auto;
            text-align: center;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-box">
            <div class="logo-circle">BS</div>
            <div class="brand-titles">
                <h1>مدرسة بلماحي للدعم</h1>
                <p>BELMAHI'S ACADEMY</p>
            </div>
        </div>

        <nav class="nav-switch">
            <button type="button" id="btnStudent" class="nav-btn active">🎓 فضاء التلميذ</button>
            <button type="button" id="btnTeacher" class="nav-btn">👨‍🏫 فضاء الأستاذ</button>
        </nav>
    </header>

    <main>
        <!-- 1. فضاء التلميذ -->
        <section id="studentSection" class="page-section active">
            <div class="section-header">
                <h2>الواجبات والتمارين المتاحة</h2>
            </div>
            <div class="grid-cards">
                <div class="card">
                    <h3>تمرين في الفيزياء - الميكانيك</h3>
                    <p style="color: var(--text-dim);">تحضير تمارين السقوط الشاقولي وحركة القذائف.</p>
                    <div class="form-control">
                        <label>إرسال إجابة التلميذ:</label>
                        <textarea id="ans_1" rows="3" placeholder="اكتب الحل هنا..."></textarea>
                    </div>
                    <button type="button" class="action-btn" id="btnSubmitAnswer">تسليم الحل للأستاذ</button>
                </div>
            </div>
        </section>

        <!-- 2. دخول الأستاذ -->
        <section id="authSection" class="page-section">
            <div class="auth-box">
                <h3>دخول فضاء الأستاذ</h3>
                <p style="color: var(--text-dim); margin-bottom: 1rem;">أدخل كلمة المرور</p>
                <div class="form-control" style="margin-bottom: 1rem;">
                    <input type="password" id="passInput" placeholder="كلمة المرور...">
                </div>
                <p id="passErr" style="color: #ef4444; display: none; margin-bottom: 1rem;">كلمة المرور غير صحيحة!</p>
                <button type="button" class="action-btn" id="btnAuthCheck">تأكيد الدخول</button>
            </div>
        </section>

        <!-- 3. لوحة تحكم الأستاذ -->
        <section id="dashboardSection" class="page-section">
            <div class="section-header">
                <h2>لوحة تحكم الأستاذ</h2>
            </div>
            <div class="grid-cards">
                <div class="card">
                    <h3>➕ نشر واجب جديد</h3>
                    <div class="form-control">
                        <input type="text" id="taskTitle" placeholder="عنوان التمرين">
                    </div>
                    <button type="button" class="action-btn" style="background: var(--accent-green);" id="btnPublishTask">نشر الواجب</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        // إعداد الاتصال بـ Supabase
        const SUPABASE_URL = 'https://ybtglszuaeqkmenktlei.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GSUxXM1hnqJoQzPNKAHltQ_h3J4autm';

        var client = null;
        if (window.supabase) {
            client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // أزرار التنقل
        document.getElementById('btnStudent').onclick = function() {
            document.getElementById('studentSection').style.display = 'block';
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'none';

            document.getElementById('btnStudent').classList.add('active');
            document.getElementById('btnTeacher').classList.remove('active');
        };

        document.getElementById('btnTeacher').onclick = function() {
            document.getElementById('studentSection').style.display = 'none';
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('dashboardSection').style.display = 'none';

            document.getElementById('btnTeacher').classList.add('active');
            document.getElementById('btnStudent').classList.remove('active');
        };

        // تسجيل الدخول
        document.getElementById('btnAuthCheck').onclick = function() {
            var pass = document.getElementById('passInput').value;
            if (pass === "momo31.A") {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                document.getElementById('passErr').style.display = 'none';
            } else {
                document.getElementById('passErr').style.display = 'block';
            }
        };

        // إرسال الإجابة
        document.getElementById('btnSubmitAnswer').onclick = async function() {
            var val = document.getElementById('ans_1').value;
            if(!val.trim()) {
                alert('يرجى كتابة الإجابة أولاً');
                return;
            }
            if(client) {
                await client.from('answers').insert([{ answer: val }]);
            }
            alert('تم إرسال إجابتك بنجاح!');
            document.getElementById('ans_1').value = '';
        };

        // نشر الواجب
        document.getElementById('btnPublishTask').onclick = async function() {
            var title = document.getElementById('taskTitle').value;
            if(!title.trim()) {
                alert('يرجى إدخال العنوان');
                return;
            }
            if(client) {
                await client.from('tasks').insert([{ title: title }]);
            }
            alert('تم نشر الواجب بنجاح!');
            document.getElementById('taskTitle').value = '';
        };
    </script>
</body>
</html>
