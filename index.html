<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مدرسة بلماحي للدعم - Belmahi's School</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- مكتبة Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1e293b;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-circle {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #0284c7, #0d9488);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
        }

        .brand-titles h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .brand-titles p {
            font-size: 0.75rem;
            color: var(--accent-blue);
        }

        .nav-switch {
            background: #020617;
            padding: 4px;
            border-radius: 10px;
            display: flex;
            border: 1px solid var(--border-color);
            gap: 5px;
        }

        .nav-btn {
            padding: 10px 20px;
            border-radius: 8px;
            color: var(--text-dim);
            background: transparent;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .nav-btn.active {
            background: var(--accent-blue);
            color: #020617;
            font-weight: 700;
        }

        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        .section-header {
            margin-bottom: 2rem;
        }

        .section-header h2 {
            font-size: 1.5rem;
            border-right: 4px solid var(--accent-blue);
            padding-right: 12px;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-control input, .form-control textarea {
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: white;
        }

        .action-btn {
            background: var(--accent-blue);
            color: #020617;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-box {
            max-width: 400px;
            margin: 3rem auto;
            text-align: center;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .answer-item {
            background: #090d16;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-box">
            <div class="logo-circle">BS</div>
            <div class="brand-titles">
                <h1>مدرسة بلماحي للدعم</h1>
                <p>BELMAHI'S ACADEMY</p>
            </div>
        </div>

        <nav class="nav-switch">
            <button type="button" id="btnStudent" class="nav-btn active">🎓 فضاء التلميذ</button>
            <button type="button" id="btnTeacher" class="nav-btn">👨‍🏫 فضاء الأستاذ</button>
        </nav>
    </header>

    <main>
        <!-- 1. فضاء التلميذ -->
        <section id="studentSection" class="page-section active">
            <div class="section-header">
                <h2>الواجبات والتمارين المتاحة</h2>
            </div>

            <!-- هنا ستظهر التمارين المحملة من Supabase تلقائياً -->
            <div class="grid-cards" id="tasksContainer">
                <p style="color: var(--text-dim);">جاري تحميل التمارين...</p>
            </div>
        </section>

        <!-- 2. دخول الأستاذ -->
        <section id="authSection" class="page-section">
            <div class="auth-box">
                <h3>دخول فضاء الأستاذ</h3>
                <p style="color: var(--text-dim); margin-bottom: 1rem;">أدخل كلمة المرور</p>
                <div class="form-control" style="margin-bottom: 1rem;">
                    <input type="password" id="passInput" placeholder="كلمة المرور...">
                </div>
                <p id="passErr" style="color: #ef4444; display: none; margin-bottom: 1rem;">كلمة المرور غير صحيحة!</p>
                <button type="button" class="action-btn" id="btnAuthCheck">تأكيد الدخول</button>
            </div>
        </section>

        <!-- 3. لوحة تحكم الأستاذ -->
        <section id="dashboardSection" class="page-section">
            <div class="section-header">
                <h2>لوحة تحكم الأستاذ</h2>
            </div>
            <div class="grid-cards">
                <!-- إضافة واجب -->
                <div class="card">
                    <h3>➕ نشر واجب جديد</h3>
                    <div class="form-control">
                        <label>عنوان التمرين</label>
                        <input type="text" id="taskTitle" placeholder="مثال: واجب الفيزياء - الميكانيك">
                    </div>
                    <button type="button" class="action-btn" style="background: var(--accent-green);" id="btnPublishTask">نشر الواجب الآن</button>
                </div>

                <!-- عرض إجابات التلاميذ -->
                <div class="card">
                    <h3>📝 إجابات التلاميذ المسلمة</h3>
                    <div id="answersContainer">
                        <p style="color: var(--text-dim);">جاري تحميل الإجابات...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://ybtglszuaeqkmenktlei.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GSUxXM1hnqJoQzPNKAHltQ_h3J4autm';

        var client = null;
        if (window.supabase) {
            client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // أزرار التنقل
        document.getElementById('btnStudent').onclick = function() {
            document.getElementById('studentSection').style.display = 'block';
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'none';

            document.getElementById('btnStudent').classList.add('active');
            document.getElementById('btnTeacher').classList.remove('active');
            loadTasks(); // إعادة جلب الواجبات
        };

        document.getElementById('btnTeacher').onclick = function() {
            document.getElementById('studentSection').style.display = 'none';
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('dashboardSection').style.display = 'none';

            document.getElementById('btnTeacher').classList.add('active');
            document.getElementById('btnStudent').classList.remove('active');
        };

        // تسجيل دخول الأستاذ
        document.getElementById('btnAuthCheck').onclick = function() {
            var pass = document.getElementById('passInput').value;
            if (pass === "momo31.A") {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                document.getElementById('passErr').style.display = 'none';
                loadAnswers(); // جلب إجابات التلاميذ للأستاذ
            } else {
                document.getElementById('passErr').style.display = 'block';
            }
        };

        // 1. جلب التمارين المرفوعة وعرضها للتلميذ
        async function loadTasks() {
            var container = document.getElementById('tasksContainer');
            if(!client) return;

            const { data, error } = await client.from('tasks').select('*').order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                container.innerHTML = '<p style="color: var(--text-dim);">لا توجد تمارين متاحة حالياً.</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(function(task) {
                var card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${task.title}</h3>
                    <hr style="border-color: var(--border-color); opacity: 0.3;">
                    <div class="form-control">
                        <label>إرسال إجابة التلميذ:</label>
                        <textarea id="ans_${task.id}" rows="3" placeholder="اكتب الحل هنا..."></textarea>
                    </div>
                    <button type="button" class="action-btn" onclick="submitStudentAnswer(${task.id})">تسليم الحل للأستاذ</button>
                `;
                container.appendChild(card);
            });
        }

        // 2. إرسال إجابة التلميذ إلى Supabase
        async function submitStudentAnswer(taskId) {
            var input = document.getElementById('ans_' + taskId);
            var val = input ? input.value : '';

            if(!val.trim()) {
                alert('يرجى كتابة الإجابة أولاً');
                return;
            }

            if(client) {
                await client.from('answers').insert([{ answer: val, task_id: taskId }]);
            }
            alert('تم إرسال إجابتك بنجاح للأستاذ!');
            if(input) input.value = '';
        }

        // 3. نشر واجب جديد من الأستاذ
        document.getElementById('btnPublishTask').onclick = async function() {
            var titleInput = document.getElementById('taskTitle');
            var title = titleInput.value;

            if(!title.trim()) {
                alert('يرجى إدخال عنوان التمرين');
                return;
            }

            if(client) {
                await client.from('tasks').insert([{ title: title }]);
            }
            alert('تم نشر الواجب بنجاح وسيظهر فوراً للطلاب!');
            titleInput.value = '';
            loadTasks();
        };

        // 4. جلب إجابات التلاميذ وعرضها للأستاذ
        async function loadAnswers() {
            var container = document.getElementById('answersContainer');
            if(!client) return;

            const { data, error } = await client.from('answers').select('*').order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                container.innerHTML = '<p style="color: var(--text-dim);">لا توجد إجابات مسلمة حتى الآن.</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(function(item) {
                var div = document.createElement('div');
                div.className = 'answer-item';
                div.innerHTML = `
                    <strong style="color: var(--accent-blue);">إجابة تلميذ:</strong>
                    <p style="font-size: 0.9rem; color: var(--text-light); margin-top: 5px;">${item.answer}</p>
                `;
                container.appendChild(div);
            });
        }

        // تحضير البيانات عند بدء الفتح
        loadTasks();
    </script>
</body>
</html>
